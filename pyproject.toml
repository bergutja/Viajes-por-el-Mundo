[project]
name = "rumbo"
version = "0.1.0"
description = "Base local de Rumbo: API FastAPI e interfaz Svelte con TypeScript"
readme = "README.md"
authors = [
    { name = "Javier", email = "bergutja@jcyl.es" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.2",
    "numpy>=2.5.4",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
rumbo = "rumbo:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
